name: CI

on:
  push:
  pull_request:

jobs:
  # Proves the README's quick start works on a clean machine:
  # copy .env.example, `docker compose up --build`, seed, use the app, run the tests.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build and start db, backend, frontend
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Backend health check
        run: curl --fail --silent http://localhost:8000/api/health

      - name: Seed demo data
        run: docker compose exec -T backend python -m app.seed

      - name: API returns the seeded leads
        run: |
          count=$(curl --fail --silent http://localhost:8000/api/leads | jq length)
          echo "leads: $count"
          test "$count" -ge 6

      - name: API error shape (404 and 422)
        run: |
          curl --silent http://localhost:8000/api/leads/999999 | tee /dev/stderr | jq -e '.code == "not_found"'
          curl --silent -X POST http://localhost:8000/api/leads -H 'content-type: application/json' -d '{"name":""}' \
            | tee /dev/stderr | jq -e '.code == "validation_error"'

      - name: CORS allows the frontend origin
        run: |
          curl --silent --include http://localhost:8000/api/leads -H 'Origin: http://localhost:3000' \
            | grep -i '^access-control-allow-origin: http://localhost:3000'

      - name: Frontend serves the app
        run: curl --fail --silent http://localhost:3000 | grep -q 'LeadFlow'

      - name: Backend tests (pytest inside the container)
        run: docker compose exec -T backend pytest -v

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
